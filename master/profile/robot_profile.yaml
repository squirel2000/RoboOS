robot:
  - robot_name: "Robot_B"
    robot_type: "mobile_robot"
    robot_state: "idle"
    robot_description: "A mobile robot equipped with a navigation system (ROS2) and a speaker. It is suitable for guiding people."
    robot_tools:
      - tool_name: "guide_patient_to_room"
        tool_description: "Guides a person from the current location to a specified room number."
        tool_usage: "guide_patient_to_room(room_number='xxx')"
        tool_example: "guide_patient_to_room(room_number='001')"
      - tool_name: "speak"
        tool_description: "Speaks a given message out loud."
        tool_usage: "speak(message='...')"
        tool_example: "speak(message='Please follow me.')"
